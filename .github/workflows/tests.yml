name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Librerías del sistema para Qt sin pantalla
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libudev1
      - name: Dependencias de Python
        run: pip install -r requirements-dev.txt
      - name: Pruebas (Qt en modo offscreen, adb/scrcpy simulados)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
